<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>kkh725 Portfolio — 스마트병원 · 피스 · 인천공항</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: #ffffff;
      overflow-x: hidden;
      font-family: -apple-system, 'Noto Sans KR', sans-serif;
    }

    .proj-section {
      width: 100%;
    }

    .proj-section iframe {
      display: block;
      width: 100%;
      height: 900px; /* placeholder until JS measures real content height */
      border: none;
    }

    .proj-divider {
      border: none;
      border-top: 8px solid #f0f0f0;
    }

    /* ── TOC NAV (project-level, accordion) ── */
    .toc-nav {
      position: fixed;
      top: 50%;
      right: 28px;
      transform: translateY(-50%);
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .toc-group { display: flex; flex-direction: column; }

    .toc-main {
      font-size: 0.8rem;
      color: rgba(34,34,34,0.35);
      text-decoration: none;
      font-weight: 700;
      padding: 0.2rem 1rem 0.2rem 0.9rem;
      border-right: 2px solid rgba(34,34,34,0.1);
      transition: color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      cursor: pointer;
    }

    .toc-main:hover { color: #222; }
    .toc-group.active .toc-main { color: #007AFF; border-right-color: #007AFF; }

    .toc-sub {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      padding-right: 0.9rem;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
    }

    .toc-group.expanded .toc-sub {
      max-height: 400px;
      opacity: 1;
      margin-top: 0.5rem;
    }

    .toc-sub a {
      font-size: 0.7rem;
      font-weight: 600;
      color: rgba(34,34,34,0.35);
      text-decoration: none;
      padding: 0.05rem 1.1rem 0.05rem 1.3rem;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .toc-sub a:hover { color: #007AFF; }

    @media (min-width: 1100px) {
      .toc-nav { display: flex; }
    }
  </style>
</head>
<body>

<nav class="toc-nav" id="toc-nav">
  <div class="toc-group" data-project="proj-smart-hospital" data-iframe="iframe-1">
    <a class="toc-main">스마트병원</a>
    <div class="toc-sub">
      <a data-target="overview">개요</a>
      <a data-target="contribution">기여</a>
      <a data-target="case-1">Case 1</a>
      <a data-target="case-2">Case 2</a>
      <a data-target="case-3">Case 3</a>
      <a data-target="case-4">Case 4</a>
      <a data-target="arch-detail">아키텍처</a>
      <a data-target="feature-detail">화면 보기</a>
    </div>
  </div>
  <div class="toc-group" data-project="proj-piece" data-iframe="iframe-2">
    <a class="toc-main">피스</a>
    <div class="toc-sub">
      <a data-target="overview">개요</a>
      <a data-target="contribution">기여</a>
      <a data-target="case-1">Case 1</a>
      <a data-target="case-2">Case 2</a>
      <a data-target="case-3">Case 3</a>
      <a data-target="arch-detail">아키텍처</a>
      <a data-target="features">화면 보기</a>
    </div>
  </div>
  <div class="toc-group" data-project="proj-icn" data-iframe="iframe-3">
    <a class="toc-main">인천공항</a>
    <div class="toc-sub">
      <a data-target="performance">성능</a>
      <a data-target="features">주요 기능</a>
      <a data-target="tech">기술 스택</a>
      <a data-target="store">스토어</a>
    </div>
  </div>
</nav>

<section class="proj-section" id="proj-smart-hospital">
  <iframe id="iframe-1" src="smart_hospital.html" title="Smart Hospital"></iframe>
</section>

<hr class="proj-divider"/>

<section class="proj-section" id="proj-piece">
  <iframe id="iframe-2" src="piece_project.html" title="Piece"></iframe>
</section>

<hr class="proj-divider"/>

<section class="proj-section" id="proj-icn">
  <iframe id="iframe-3" src="icn_project.html" title="인천공항+"></iframe>
</section>

<script>
  // Each embedded page has a `.hero { min-height: 100vh }` section. Inside an
  // iframe, "100vh" is relative to the IFRAME's own height — so naively
  // resizing the iframe to fit content creates a feedback loop (resize ->
  // hero grows -> scrollHeight grows -> resize again, forever). Fix: pin the
  // hero to the outer window's real viewport height (in px) once the iframe
  // loads, so it renders exactly like a normal full-screen hero, then measure
  // the now-stable scrollHeight and size the iframe to that.
  function stabilizeAndFit(iframe) {
    let doc;
    try { doc = iframe.contentDocument; } catch (e) { return; }
    if (!doc || !doc.body) return;

    if (!doc.getElementById('__vh_fix__')) {
      const style = doc.createElement('style');
      style.id = '__vh_fix__';
      style.textContent = `.hero { min-height: ${window.innerHeight}px !important; }`;
      doc.head.appendChild(style);
    }

    const height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
    if (height > 0) iframe.style.height = height + 'px';
  }

  ['iframe-1', 'iframe-2', 'iframe-3'].forEach(id => {
    const iframe = document.getElementById(id);
    iframe.addEventListener('load', () => {
      stabilizeAndFit(iframe);
      // re-check a few times for late image/font layout shifts; safe now
      // that the hero height no longer depends on the iframe's own height
      [50, 200, 600, 1200, 2500].forEach(delay => {
        setTimeout(() => stabilizeAndFit(iframe), delay);
      });
    });
  });

  // ── Accordion nav: expand the current project's sub-chapters, collapse the rest ──
  const tocGroups = Array.from(document.querySelectorAll('.toc-group'));

  function setActiveGroup(projectId) {
    tocGroups.forEach(g => {
      const isMatch = g.dataset.project === projectId;
      g.classList.toggle('active', isMatch);
      g.classList.toggle('expanded', isMatch);
    });
  }

  const projTargets = tocGroups
    .map(g => document.getElementById(g.dataset.project))
    .filter(Boolean);

  const projIo = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      setActiveGroup(entry.target.id);
    });
  }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });

  projTargets.forEach(el => projIo.observe(el));

  // scroll the OUTER page so a section inside a (non-internally-scrolling)
  // iframe lands in view, since the iframe itself has nothing left to scroll
  function scrollToInnerSection(iframe, sectionId) {
    let doc;
    try { doc = iframe.contentDocument; } catch (e) { return; }
    const el = doc && doc.getElementById(sectionId);
    if (!el) return;
    const iframeTop = iframe.getBoundingClientRect().top + window.scrollY;
    const elTop = el.getBoundingClientRect().top; // relative to iframe's own viewport
    window.scrollTo({ top: iframeTop + elTop - 16, behavior: 'smooth' });
  }

  tocGroups.forEach(group => {
    const projectId = group.dataset.project;
    const iframe = document.getElementById(group.dataset.iframe);

    group.querySelector('.toc-main').addEventListener('click', () => {
      setActiveGroup(projectId);
      document.getElementById(projectId).scrollIntoView({ behavior: 'smooth' });
    });

    group.querySelectorAll('.toc-sub a').forEach(a => {
      a.addEventListener('click', () => {
        scrollToInnerSection(iframe, a.dataset.target);
      });
    });
  });
</script>

</body>
</html>
